<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja dos Números - O Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="hud-item">⭐ <span id="score">0</span></div>
            <div class="hud-item">❤️ <span id="lives">3/3</span></div>
            <div class="hud-item"><span id="phase-display">Fase 1</span></div>
            <button class="btn-shop" onclick="toggleShop(true)">🛒 Loja</button>
        </div>

        <div class="game-screen" id="game-screen">
            </div>

        <div class="input-container">
            <div class="display-row">
                <div class="calc-display" id="calc-display">?</div>
                <button class="btn-check" onclick="checkAnswer()">✓</button>
            </div>
            
            <div class="keyboard">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key btn-clear" onclick="pressKey('C')">C</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key btn-clear" onclick="pressKey('BACK')">⌫</button>
            </div>
        </div>
    </div>

    <div class="shop-modal" id="shop-modal" style="display: none;">
        <div class="shop-content">
            <h2>🥷 Loja Ninja</h2>
            <p>Use suas estrelas (⭐) para comprar vantagens!</p>
            <hr>
            <div class="shop-item">
                <span>❤️ Comprar 1 Vida (Máx 3)</span>
                <button onclick="buyLife()">Preço: 15 ⭐</button>
            </div>
            <button class="btn-close-shop" onclick="toggleShop(false)">Fechar Loja</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
